<style>
:root {
  --bg: #0c0c0c;
  --card-top: #232323;
  --card-bot: #1c1c1c;
  --digit-color: #d8d8d8;
  --digit-dim: #888;
  --split: #0c0c0c;
  --dot: #b8963c;
  --btn-bg: #181818;
  --btn-border: #2a2a2a;
  --btn-fg: #666;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }

.page {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 2.8vh, 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}

/* ─── Clock row ─── */
.clock {
  display: flex;
  align-items: center;
  gap: clamp(10px, 2.2vw, 26px);
}

/* ─── Flip unit ─── */
.unit {
  position: relative;
  width: clamp(100px, 22vw, 240px);
  height: clamp(128px, 28vw, 300px);
  perspective: 1200px;
}
@media (max-width: 500px) {
  .unit { width: clamp(68px, 19vw, 100px); height: clamp(88px, 24vw, 128px); }
  .clock { gap: clamp(5px, 1.5vw, 10px); }
  .sep { gap: 10px; }
  .dot { width: 8px; height: 8px; }
}

.half {
  position: absolute;
  left: 0; right: 0;
  width: 100%; height: 50%;
  overflow: hidden;
  border-radius: 6px;
}
.half-top {
  top: 0;
  background: var(--card-top);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.3);
}
.half-bot {
  bottom: 0;
  background: var(--card-bot);
  box-shadow: inset 0 1px 0 rgba(0,0,0,0.4), inset 0 -1px 0 rgba(0,0,0,0.2);
}
.digit {
  position: absolute;
  left: 0; right: 0;
  width: 100%; height: 200%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: clamp(100px, 22.5vw, 248px);
  color: var(--digit-color);
  font-variant-numeric: tabular-nums;
  user-select: none;
  pointer-events: none;
  transition: color 0.4s ease;
}
.half-top .digit { top: 0; }
.half-bot .digit { top: -100%; }

.gap {
  position: absolute;
  left: 0; right: 0;
  top: calc(50% - 1px);
  height: 2px;
  background: var(--split);
  z-index: 30;
  pointer-events: none;
}

/* ─── Flaps ─── */
.flap {
  position: absolute;
  left: 0; right: 0;
  width: 100%; height: 50%;
  overflow: hidden;
  border-radius: 6px;
  backface-visibility: hidden;
  z-index: 20;
}
.flap-top {
  top: 0;
  background: var(--card-top);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  transform-origin: bottom center;
}
.flap-bot {
  bottom: 0;
  background: var(--card-bot);
  transform-origin: top center;
}
.flap-top .digit { top: 0; }
.flap-bot .digit { top: -100%; }

.flap-top.go { animation: dropTop 0.3s cubic-bezier(0.5,0,0.8,0.5) forwards; }
.flap-bot.go { animation: riseBot 0.3s cubic-bezier(0.2,0.5,0.5,1) 0.24s forwards; }
@keyframes dropTop {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 20px rgba(0,0,0,0.7); }
}
@keyframes riseBot {
  0%   { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}
@media (prefers-reduced-motion: reduce) {
  .flap-top.go, .flap-bot.go { animation-duration: 0.01s; }
}

/* ─── Separator dots ─── */
.sep {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 2.4vw, 26px);
  margin-bottom: 4px;
  flex-shrink: 0;
}
.dot {
  width: clamp(9px, 1.8vw, 17px);
  height: clamp(9px, 1.8vw, 17px);
  border-radius: 50%;
  background: var(--dot);
  box-shadow: 0 0 10px rgba(184,150,60,0.4);
  transition: background 0.4s, box-shadow 0.4s;
}

/* ─── Word label ─── */
.word-label {
  font-family: 'Inter', sans-serif;
  font-size: clamp(9px, 1.2vw, 11px);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: transparent;
  transition: color 0.3s, opacity 0.3s;
  height: 14px;
  opacity: 0;
}
.word-label.visible { opacity: 1; }

/* ─── Info row ─── */
.info-row {
  display: flex;
  align-items: center;
  gap: clamp(20px, 4vw, 48px);
  font-family: 'Inter', sans-serif;
}
.ampm {
  font-size: clamp(13px, 2.2vw, 20px);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--digit-dim);
}
.seconds-wrap { display: flex; align-items: center; gap: 6px; }
.sec-label {
  font-size: clamp(9px, 1.3vw, 11px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #3a3a3a;
}
.seconds {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(20px, 3.4vw, 34px);
  color: var(--digit-dim);
  font-variant-numeric: tabular-nums;
  min-width: 2ch;
  text-align: center;
}
.date-line {
  font-size: clamp(11px, 1.8vw, 16px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #3a3a3a;
  white-space: nowrap;
}

/* ─── Category menu ─── */
.cat-menu {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  transition: opacity .5s;
}
.cat-btn {
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 20px;
  color: var(--btn-fg);
  font-family: 'Inter', sans-serif;
  font-size: clamp(10px, 1.5vw, 12px);
  letter-spacing: 0.06em;
  padding: 7px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color .15s, background .15s, border-color .15s;
  white-space: nowrap;
}
.cat-btn:hover { color: #bbb; background: #222; }
.cat-btn.active {
  color: #fff;
  border-color: var(--cat-active-color, #444);
  background: #1e1e1e;
  box-shadow: 0 0 10px var(--cat-active-color, #444)44, inset 0 0 0 1px var(--cat-active-color, #444)33;
  font-weight: 600;
}
.cat-btn.active .dot-cat {
  box-shadow: 0 0 6px var(--cat-active-color, #888);
}
.cat-btn .dot-cat {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─── Buttons ─── */
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.ctrl {
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  color: var(--btn-fg);
  font-family: 'Inter', sans-serif;
  font-size: clamp(11px, 1.8vw, 13px);
  letter-spacing: 0.07em;
  padding: clamp(9px, 1.5vh, 12px) clamp(14px, 2.5vw, 20px);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color .15s, background .15s;
  white-space: nowrap;
}
.ctrl:hover { color: #bbb; background: #222; }
.ctrl:focus-visible { outline: 2px solid #444; outline-offset: 2px; }

.wake-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #2a2a2a;
  transition: background .3s, box-shadow .3s;
}
.wake-dot.on { background: #6db86d; box-shadow: 0 0 6px rgba(109,184,109,0.5); }

/* Fullscreen hide — manejado directamente por JS */
.controls, .cat-menu { transition: opacity .4s; }

/* ─── Landscape mobile ─── */
@media (max-height: 500px) {
  .page { gap: clamp(6px, 1.2vh, 12px); padding-block: 10px; }
  .unit { width: clamp(56px, 18vh, 120px); height: clamp(72px, 23vh, 152px); }
  .digit { font-size: clamp(56px, 18.5vh, 124px); }
  .info-row { font-size: clamp(8px, 1.4vh, 11px); }
  .ampm { font-size: clamp(11px, 1.8vh, 16px); }
  .seconds { font-size: clamp(14px, 2.5vh, 20px); }
  .cat-btn { font-size: 10px; padding: 5px 10px; }
}
</style>

<script>
// ─── Word lists by category ───
const WORDS = {
  espiritual: [
    {w:'DIOS',l:'es'},{w:'ALMA',l:'es'},{w:'FIEL',l:'es'},{w:'GOZO',l:'es'},
    {w:'REZA',l:'es'},{w:'CREE',l:'es'},{w:'OBRA',l:'es'},{w:'AMEN',l:'es'},
    {w:'CRUZ',l:'es'},{w:'ORAR',l:'es'},{w:'CELO',l:'es'},{w:'BESO',l:'es'},
    {w:'GOD' ,l:'en'},{w:'HOLY',l:'en'},{w:'PRAY',l:'en'},{w:'SOUL',l:'en'},
    {w:'BORN',l:'en'},{w:'WORD',l:'en'},{w:'PURE',l:'en'},{w:'AMEN',l:'en'},
    {w:'HOPE',l:'en'},{w:'LORD',l:'en'}
  ],
  amor: [
    {w:'AMOR',l:'es'},{w:'VIDA',l:'es'},{w:'BIEN',l:'es'},{w:'ERES',l:'es'},
    {w:'BESO',l:'es'},{w:'TUYO',l:'es'},{w:'DAME',l:'es'},{w:'MIEL',l:'es'},
    {w:'LAZO',l:'es'},{w:'FIEL',l:'es'},
    {w:'LOVE',l:'en'},{w:'LIFE',l:'en'},{w:'GIVE',l:'en'},{w:'SING',l:'en'},
    {w:'TRUE',l:'en'},{w:'CARE',l:'en'},{w:'KISS',l:'en'},{w:'BOND',l:'en'},
    {w:'KIND',l:'en'},{w:'WARM',l:'en'},{w:'HOLD',l:'en'}
  ],
  paz: [
    {w:'CURA',l:'es'},{w:'AQUI',l:'es'},{w:'ORAN',l:'es'},{w:'SANA',l:'es'},
    {w:'LEVE',l:'es'},{w:'VALE',l:'es'},{w:'BIEN',l:'es'},{w:'SUMO',l:'es'},
    {w:'HEAL',l:'en'},{w:'REST',l:'en'},{w:'CALM',l:'en'},{w:'FREE',l:'en'},
    {w:'WILL',l:'en'},{w:'SOFT',l:'en'},{w:'EASY',l:'en'},{w:'HUSH',l:'en'},
    {w:'SLOW',l:'en'}
  ],
  motivacion: [
    {w:'SUBE',l:'es'},{w:'ERES',l:'es'},{w:'GANA',l:'es'},{w:'DALE',l:'es'},
    {w:'VIVE',l:'es'},{w:'CREA',l:'es'},{w:'MIRA',l:'es'},{w:'ANDA',l:'es'},
    {w:'HAZE',l:'es'},
    {w:'RISE',l:'en'},{w:'SEEK',l:'en'},{w:'GROW',l:'en'},{w:'BOLD',l:'en'},
    {w:'FLOW',l:'en'},{w:'PUSH',l:'en'},{w:'DARE',l:'en'},{w:'MOVE',l:'en'},
    {w:'WORK',l:'en'},{w:'LEAD',l:'en'}
  ]
};

// Color per category
const CAT_COLOR = {
  espiritual: '#c4a7f0',
  amor:       '#f07a96',
  paz:        '#7dd87d',
  motivacion: '#7ab8f5',
  aleatoria:  '#d8c080'
};

// ─── Category state ───
let category = localStorage.getItem('clkCat') || 'ninguna';
let wordIdx = {};  // per-category round-robin index

function getWord() {
  const cats = Object.keys(WORDS);
  const filterLang = uiLang; // 'es' or 'en'
  const filtered = cat => (WORDS[cat] || []).filter(w => w.l === filterLang);

  if (category === 'aleatoria') {
    const cat = cats[Math.floor(Math.random() * cats.length)];
    const pool = filtered(cat);
    if (!pool.length) return null;
    return { ...pool[Math.floor(Math.random() * pool.length)], cat };
  }
  const pool = filtered(category);
  if (!pool.length) return null;
  if (wordIdx[category] === undefined) wordIdx[category] = 0;
  const entry = pool[wordIdx[category] % pool.length];
  wordIdx[category]++;
  return { ...entry, cat: category };
}

const CAT_ACTIVE_COLOR = {
  ninguna:    '#444',
  aleatoria:  '#b8963c',
  espiritual: '#c4a7f0',
  amor:       '#f07a96',
  paz:        '#7dd87d',
  motivacion: '#7ab8f5'
};

function setCategory(cat) {
  category = cat;
  localStorage.setItem('clkCat', cat);
  const color = CAT_ACTIVE_COLOR[cat] || '#444';
  document.querySelectorAll('.cat-btn').forEach(b => {
    const isActive = b.dataset.cat === cat;
    b.classList.toggle('active', isActive);
    if (isActive) b.style.setProperty('--cat-active-color', color);
    else b.style.removeProperty('--cat-active-color');
  });
  // Show first word immediately when activating a category
  if (cat !== 'ninguna' && !showingWord) showWord();
  // If switching back to solo hora, cancel any pending word
  if (cat === 'ninguna') {
    clearTimeout(wordTimer);
    showingWord = false;
    setDigitColor('');
    document.getElementById('wordLabel').classList.remove('visible');
    cur.fill('');
    tick();
  }
}

// Init active button with color
document.querySelectorAll('.cat-btn').forEach(b => {
  const isActive = b.dataset.cat === category;
  b.classList.toggle('active', isActive);
  if (isActive) b.style.setProperty('--cat-active-color', CAT_ACTIVE_COLOR[category] || '#444');
});

// ─── Wake Lock ───
let wl = null, wantWake = false;
async function requestWake() {
  try {
    wl = await navigator.wakeLock.request('screen');
    wantWake = true;
    document.getElementById('wd').classList.add('on');
    wl.addEventListener('release', () => document.getElementById('wd').classList.remove('on'));
  } catch(e) {}
}
async function toggleWake() {
  if (wl && !wl.released) { await wl.release(); wl = null; wantWake = false; }
  else await requestWake();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wantWake) requestWake();
});
requestWake();

// ─── Fullscreen ───
let fsActive = false;
let moveTimer;
const UI_ELEMENTS = () => [
  document.querySelector('.controls'),
  document.querySelector('.cat-menu')
];

function hideUI() {
  UI_ELEMENTS().forEach(el => { if (el) el.style.opacity = '0'; });
  document.documentElement.style.cursor = 'none';
}
function showUI() {
  UI_ELEMENTS().forEach(el => { if (el) el.style.opacity = ''; });
  document.documentElement.style.cursor = '';
}

function setFS(on) {
  fsActive = on;
  if (on) hideUI(); else showUI();
}

function toggleFS() {
  const el = document.documentElement;
  if (!fsActive) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen
              || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen
               || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit) exit.call(document);
  }
}

// fullscreenchange maneja entrada Y salida
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(ev => document.addEventListener(ev, () => {
    const inFS = !!(document.fullscreenElement || document.webkitFullscreenElement
                 || document.mozFullScreenElement || document.msFullscreenElement);
    setFS(inFS);
  }));

// Mostrar UI brevemente al mover el mouse en fullscreen
document.addEventListener('mousemove', () => {
  if (!fsActive) return;
  showUI();
  clearTimeout(moveTimer);
  moveTimer = setTimeout(() => { if (fsActive) hideUI(); }, 2500);
});

// ─── Flip ───
const cur = ['','','',''];
function pad2(n) { return String(n).padStart(2,'0'); }

function setDigitColor(color) {
  document.querySelectorAll('.digit').forEach(d => d.style.color = color || '');
  const dots = [document.getElementById('dotA'), document.getElementById('dotB')];
  dots.forEach(d => { if(d) d.style.background = color || ''; d.style.boxShadow = color ? `0 0 10px ${color}66` : ''; });
}

function flip(idx, newCh) {
  if (cur[idx] === newCh) return;
  const el = document.getElementById('u'+idx);
  const st = el.querySelector('.st');
  const sb = el.querySelector('.sb');
  const ft = el.querySelector('.ft');
  const fb = el.querySelector('.fb');
  const fT = el.querySelector('.flap-top');
  const fB = el.querySelector('.flap-bot');
  const old = cur[idx] || newCh;
  cur[idx] = newCh;
  st.textContent = newCh;
  sb.textContent = newCh;
  ft.textContent = old;
  fb.textContent = newCh;
  fT.classList.remove('go'); fB.classList.remove('go');
  void fT.offsetWidth;
  fT.classList.add('go'); fB.classList.add('go');
}

// ─── Word display ───
let showingWord = false;
let wordTimer = null;

function showWord() {
  const entry = getWord();
  if (!entry) return;
  const word = entry.w.padEnd(4,' ');
  const color = CAT_COLOR[entry.cat] || CAT_COLOR.aleatoria;
  showingWord = true;

  setDigitColor(color);

  for (let i = 0; i < 4; i++) flip(i, word[i]);

  // Show category label
  const lbl = document.getElementById('wordLabel');
  const catNames = {es:{espiritual:'ESPIRITUAL',amor:'AMOR',paz:'PAZ',motivacion:'MOTIVACIÓN',aleatoria:'ALEATORIA'},en:{espiritual:'SPIRITUAL',amor:'LOVE',paz:'PEACE',motivacion:'MOTIVATION',aleatoria:'RANDOM'}};
  const catName = (catNames[uiLang]||catNames.es)[entry.cat] || entry.cat.toUpperCase();
  lbl.textContent = catName + ' · ' + (entry.l === 'es' ? 'ES' : 'EN');
  lbl.style.color = color;
  lbl.classList.add('visible');

  clearTimeout(wordTimer);
  wordTimer = setTimeout(() => {
    lbl.classList.remove('visible');
    setDigitColor('');
    showingWord = false;
    cur.fill('');
    tick();
  }, 3500);
}

// ─── 12h/24h ───
let use24 = localStorage.getItem('clk24') === '1';
function toggleFmt() {
  use24 = !use24;
  localStorage.setItem('clk24', use24 ? '1' : '0');
  updateFmtBtn();
  cur.fill('');
  tick();
}
function updateFmtBtn() {
  document.getElementById('fmtLbl').textContent = use24 ? '24h → 12h' : '12h → 24h';
  document.getElementById('ampm').style.display = use24 ? 'none' : '';
}

// ─── UI Language ───
let uiLang = localStorage.getItem('clkLang') || 'es';

function applyUILang() {
  const dotColors = {ninguna:'#444',aleatoria:'#b8963c',espiritual:'#9b7fd4',amor:'#d46b7f',paz:'#6db86d',motivacion:'#6b9fd4'};
  const labels = {
    es: {ninguna:'⏱ Solo hora',aleatoria:'🎲 Aleatoria',espiritual:'🙏 Espiritual',amor:'❤️ Amor',paz:'🌿 Paz',motivacion:'🚀 Motivación'},
    en: {ninguna:'⏱ Time only',aleatoria:'🎲 Random',espiritual:'🙏 Spiritual',amor:'❤️ Love',paz:'🌿 Peace',motivacion:'🚀 Motivation'}
  };
  Object.keys(labels.es).forEach(cat => {
    const btn = document.querySelector(`[data-cat="${cat}"]`);
    if (btn) btn.innerHTML = `<span class="dot-cat" style="background:${dotColors[cat]}"></span> ${labels[uiLang][cat]}`;
  });
  document.getElementById('btnFSLabel').textContent = uiLang === 'es' ? 'Pantalla completa' : 'Full screen';
  document.getElementById('btnWakeLabel').textContent = uiLang === 'es' ? 'Pantalla activa' : 'Active screen';
  document.querySelector('.sec-label').textContent = uiLang === 'es' ? 'seg' : 'sec';
  document.getElementById('langLbl').textContent = uiLang === 'es' ? 'ES → EN' : 'EN → ES';
}

function toggleLang() {
  uiLang = uiLang === 'es' ? 'en' : 'es';
  localStorage.setItem('clkLang', uiLang);
  applyUILang();
  // Restore active cat button state after innerHTML rebuild
  document.querySelectorAll('.cat-btn').forEach(b => {
    const isActive = b.dataset.cat === category;
    b.classList.toggle('active', isActive);
    if (isActive) b.style.setProperty('--cat-active-color', CAT_ACTIVE_COLOR[category] || '#444');
    else b.style.removeProperty('--cat-active-color');
  });
}

// ─── Tick ───
function tick() {
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

  // Trigger word on each new minute (s === 0)
  if ((s === 15 || s === 30 || s === 45) && !showingWord && category !== 'ninguna') showWord();

  // Update digits only when not showing a word
  if (!showingWord) {
    let ap = '';
    if (!use24) {
      ap = h < 12 ? 'AM' : 'PM';
      h = h % 12 || 12;
    }
    const hh = pad2(h), mm = pad2(m);
    flip(0, hh[0]); flip(1, hh[1]);
    flip(2, mm[0]); flip(3, mm[1]);
    if (!use24) document.getElementById('ampm').textContent = ap;
  }

  document.getElementById('secn').textContent = pad2(s);
  const locale = uiLang === 'en' ? 'en-US' : 'es-CO';
  document.getElementById('dateline').textContent =
    now.toLocaleDateString(locale, { weekday:'short', day:'numeric', month:'short', year:'numeric' })
        .replace(/,/g, '').toUpperCase();
}

updateFmtBtn();
applyUILang();
tick();
setInterval(tick, 1000);
</script>
